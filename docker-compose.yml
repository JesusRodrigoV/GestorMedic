services:
  gm-notifications-db:
    image: postgres:15-alpine
    container_name: gm-notifications-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: notifications_db
    networks:
      - gm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  gm-notifications-redis:
    image: redis:8.6-alpine
    container_name: gm-notifications-redis
    networks:
      - gm-network

  gm-backend-db:
    image: postgres:15-alpine
    container_name: gm-backend-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: gestormedic_db
    volumes:
      - gm-backend-data:/var/lib/postgresql/data
    networks:
      - gm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestormedic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  gm-backend-redis:
    image: redis:8.6-alpine
    container_name: gm-backend-redis
    networks:
      - gm-network

  gm-notifications-api:
    build:
      context: ./gestormedic-notification
      dockerfile: Dockerfile
    container_name: gm-notifications-api
    env_file:
      - ./gestormedic-notification/.env_do
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      gm-notifications-db:
        condition: service_healthy
      gm-notifications-redis:
        condition: service_started
    networks:
      - gm-network

  gm-notifications-worker:
    build:
      context: ./gestormedic-notification
      dockerfile: Dockerfile
    container_name: gm-notifications-worker
    command: celery -A app.tasks worker --loglevel=info -Q high_priority,default,bulk
    env_file:
      - ./gestormedic-notification/.env_do
    depends_on:
      - gm-notifications-redis
      - gm-notifications-db
    networks:
      - gm-network

  gm-backend:
    build:
      context: ./gestormedic-b
      dockerfile: Dockerfile
    env_file:
      - ./gestormedic-b/.env_do
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/openapi.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      gm-backend-db:
        condition: service_healthy
      gm-backend-redis:
        condition: service_started
    networks:
      - gm-network

  gm-citas:
    build:
      context: ./gestormedic-citas
      dockerfile: Dockerfile
    env_file:
      - ./gestormedic-citas/.env_do
    depends_on:
      gm-backend-db:
        condition: service_healthy
      gm-backend:
        condition: service_healthy
    networks:
      - gm-network

  api-gateway:
    build:
      context: ./gestormedic-gateway
      dockerfile: Dockerfile
    container_name: gm-api-gateway
    ports:
      - "8000:80"
    depends_on:
      - gm-backend
      - gm-citas
      - gm-notifications-api
    networks:
      - gm-network

  # gm-frontend:
  #   build: 
  #     context: ./gestormedic-f 
  #     dockerfile: Dockerfile
  #   restart: always
  #   ports:
  #     - "4200:80"
  #   depends_on:
  #     - api-gateway
  #   networks:
  #     - gm-network

volumes:
  gm-notifications-data:
    driver: local
  gm-backend-data:
    driver: local

networks:
  gm-network:
    driver: bridge