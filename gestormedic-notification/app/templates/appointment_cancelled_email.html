<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cita Cancelada</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; line-height: 1.6; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #c0392b;">Aviso de Cancelación</h2>
    <p>Te informamos que la cita médica programada para el <strong>{{ date }}</strong> ha sido cancelada.</p>
    <p><strong>Motivo de la cancelación:</strong><br>
    <span style="color: #555; background-color: #f4f4f4; padding: 10px; display: block; margin-top: 5px; border-left: 3px solid #c0392b;">{{ reason }}</span></p>
    <p>Por favor, ingresa a tu portal de paciente para reprogramar la consulta a la brevedad posible.</p>
</body>
</html>
