<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Bienvenido a GestorMedic</title>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      color: #333;
      line-height: 1.6;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    "
  >
    <h2 style="color: #2c3e50">¡Hola, {{ patient_name }}!</h2>
    <p>
      Tu registro en GestorMedic se ha completado con éxito. Ahora puedes
      gestionar tus citas médicas, acceder a tu historial y comunicarte con los
      especialistas desde una única plataforma.
    </p>
    <div style="text-align: center; margin: 30px 0">
      <a
        href="{{ login_url }}"
        style="
          background-color: #2ecc71;
          color: white;
          padding: 12px 25px;
          text-decoration: none;
          border-radius: 5px;
          font-weight: bold;
        "
        >Acceder a mi cuenta</a
      >
    </div>
    <p style="font-size: 0.8em; color: #7f8c8d; margin-top: 40px">
      Gracias por confiar en nuestra red médica.
    </p>
  </body>
</html>
