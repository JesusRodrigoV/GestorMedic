<p-button
      [label]="label()"
      [icon]="icon()"
      [severity]="severity()"
      [loading]="loading()"
      [disabled]="disabled() || loading()"
      [rounded]="rounded()"
      [outlined]="outlined()"
      [text]="text()"
      [size]="size()"
      [styleClass]="styleClass()"
      [variant]="variant()"
      (onClick)="onClick.emit($event)"
      pRipple
      fluid
    />
