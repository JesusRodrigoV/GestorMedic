<button
  pButton
  pRipple
  [label]="label()"
  [icon]="icon()"
  [severity]="severity()"
  [loading]="loading()"
  [disabled]="disabled() || loading()"
  [rounded]="rounded()"
  [outlined]="outlined()"
  [text]="text()"
  [size]="size()"
  [class]="styleClass()"
  [type]="type()"
  (click)="onClick.emit($event)"
  class="w-full"
></button>
