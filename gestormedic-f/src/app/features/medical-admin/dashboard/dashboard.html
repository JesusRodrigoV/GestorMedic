<div class="dashboard-container">
  <!-- Stats Grid -->
  <div class="stats-grid">
    <div *ngFor="let stat of stats" class="stat-card" [ngClass]="stat.color">
      <div class="stat-icon">
        <i class="pi" [ngClass]="stat.icon"></i>
      </div>
      <div class="stat-content">
        <span class="stat-label">{{ stat.label }}</span>
        <h2 class="stat-value">{{ stat.value }}</h2>
      </div>
    </div>
  </div>

  <div class="dashboard-content">
    <!-- Main Section -->
    <div class="main-column">
      <!-- Chart Card -->
      <p-card class="chart-card">
        <div class="card-header">
          <h3>Resumen de Actividad Semanal</h3>
          <gm-rounded-button label="Ver reporte" variant="outlined"></gm-rounded-button>
        </div>
        <p-chart type="line" [data]="chartData" [options]="chartOptions" height="300px"></p-chart>
      </p-card>

      <!-- Appointments List -->
      <p-card class="appointments-card">
        <div class="card-header">
          <h3>Próximas Citas</h3>
          <gm-rounded-button label="Ver agenda completa" variant="outlined"></gm-rounded-button>
        </div>
        
        <div class="appointment-items">
          <div *ngFor="let appt of upcomingAppointments" class="appointment-item">
            <div class="patient-info">
              <img [src]="appt.patientPhoto" class="patient-img">
              <div class="patient-details">
                <span class="name">{{ appt.patientName }}</span>
                <span class="type">{{ appt.type }}</span>
              </div>
            </div>
            <div class="appointment-meta">
              <span class="time"><i class="pi pi-clock"></i> {{ appt.time }}</span>
              <p-tag [value]="appt.status" [severity]="appt.statusSeverity"></p-tag>
            </div>
            <div class="appointment-actions">
              <button pButton icon="pi pi-ellipsis-v" class="p-button-text p-button-secondary"></button>
            </div>
          </div>
        </div>
      </p-card>
    </div>

    <!-- Sidebar Column -->
    <div class="side-column">
      <p-card class="activity-card">
        <h3>Actividad Reciente</h3>
        <div class="activity-timeline">
          <div *ngFor="let item of recentActivity" class="activity-item">
            <div class="activity-icon">
              <i class="pi" [ngClass]="item.icon"></i>
            </div>
            <div class="activity-text">
              <p>{{ item.text }}</p>
              <span>{{ item.time }}</span>
            </div>
          </div>
        </div>
      </p-card>

      <p-card class="quick-actions">
        <h3>Acciones Rápidas</h3>
        <div class="actions-grid">
          <gm-rounded-button label="Nueva Cita" icon="pi pi-calendar-plus" class="w-full"></gm-rounded-button>
          <gm-rounded-button label="Nuevo Paciente" icon="pi pi-user-plus" variant="outlined" class="w-full"></gm-rounded-button>
          <gm-rounded-button label="Generar Receta" icon="pi pi-file" variant="outlined" class="w-full"></gm-rounded-button>
        </div>
      </p-card>
    </div>
  </div>
</div>
