<div class="profile-card">
  <div class="card-header">
    <h3>Expediente Clínico Base</h3>
    <p>Estos datos son vitales para su atención médica y respuesta en emergencias.</p>
  </div>

  <form [formGroup]="profileForm" (ngSubmit)="onSave()" class="profile-form">
    <div class="form-section">
      <h4>Identidad y Demografía</h4>
      <div class="form-grid">
        <div class="field-group">
          <label for="ci_number">Cédula de Identidad</label>
          <input pInputText id="ci_number" formControlName="ci_number" fluid />
        </div>
        <div class="field-group">
          <label for="date_of_birth">Fecha de Nacimiento</label>
          <input pInputText type="date" id="date_of_birth" formControlName="date_of_birth" fluid />
        </div>
        <div class="field-group">
          <label for="gender">Género</label>
          <p-select
            id="gender"
            formControlName="gender"
            [options]="genderOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Seleccione"
            fluid
          />
        </div>
        <div class="field-group">
          <label for="occupation">Ocupación</label>
          <input pInputText id="occupation" formControlName="occupation" fluid />
        </div>
      </div>
    </div>

    <div class="form-section">
      <h4>Datos Médicos Críticos</h4>
      <div class="form-grid">
        <div class="field-group">
          <label for="blood_type">Grupo Sanguíneo</label>
          <p-select
            id="blood_type"
            formControlName="blood_type"
            [options]="bloodTypeOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Seleccione"
            fluid
          />
        </div>
        <div class="field-group full-width">
          <label for="allergies">Alergias Conocidas</label>
          <textarea
            pTextarea
            id="allergies"
            formControlName="allergies"
            rows="3"
            placeholder="Medicamentos, alimentos, ambientales..."
            fluid
          ></textarea>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h4>Contacto de Emergencia</h4>
      <div class="form-grid">
        <div class="field-group">
          <label for="emergency_contact_name">Nombre Completo</label>
          <input
            pInputText
            id="emergency_contact_name"
            formControlName="emergency_contact_name"
            fluid
          />
        </div>
        <div class="field-group">
          <label for="emergency_contact_phone">Teléfono</label>
          <input
            pInputText
            id="emergency_contact_phone"
            formControlName="emergency_contact_phone"
            fluid
          />
        </div>
      </div>
    </div>

    <div class="form-actions">
      <gm-rounded-button
        type="submit"
        label="Guardar Expediente"
        severity="primary"
        [loading]="store.isProcessing()"
        [disabled]="profileForm.invalid || store.isProcessing()"
      />
    </div>
  </form>
</div>
