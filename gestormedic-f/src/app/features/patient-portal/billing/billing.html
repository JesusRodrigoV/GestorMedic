<main class="page">
  <section class="card intro">
    <h2>Facturacion y recibos</h2>
    <p>Descarga tus facturas y controla tus pagos en un solo lugar.</p>
  </section>

  <section class="card">
    <h3>Comprobantes recientes</h3>
    <table>
      <thead>
        <tr>
          <th>Codigo</th>
          <th>Monto</th>
          <th>Fecha</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        @for (invoice of invoices(); track invoice.code) {
          <tr>
            <td>{{ invoice.code }}</td>
            <td>{{ invoice.amount }}</td>
            <td>{{ invoice.date }}</td>
            <td>
              <span [class.pending]="invoice.status === 'Pendiente'">{{ invoice.status }}</span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</main>
