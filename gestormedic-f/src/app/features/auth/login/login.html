<main class="login-container">
  <div class="login-bento-card glass-morphism">
    <header class="login-header">
      <img ngSrc="logos/logo.png" alt="GestorMedic Logo" width="64" height="64" priority />
      <h1 class="yale-title">Bienvenido a GestorMedic</h1>
      <p class="slate-subtitle">
        Ingrese sus credenciales para acceder a la plataforma de gestión médica.
      </p>
    </header>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
      <div class="field-group">
        <label for="email">Correo Institucional</label>
        <input
          id="email"
          type="email"
          pInputText
          formControlName="email"
          placeholder="ejemplo@gestormedic.com"
          class="gm-input"
          fluid
        />
      </div>

      <div class="field-group">
        <label for="password">Contraseña</label>
        <p-password
          id="password"
          formControlName="password"
          [toggleMask]="true"
          [feedback]="false"
          placeholder="••••••••"
          inputStyleClass="gm-input w-full"
          fluid
        />
      </div>

      <div class="form-actions">
        <gm-rounded-button
          label="Acceder al Sistema"
          type="submit"
          [loading]="authStore.isLoading()"
          severity="primary"
          routerLink="/control/management"
        />
          <!--(onClick)="onLogin()"-->
      </div>
    </form>

    <footer class="login-footer">
      <a routerLink="/auth/forgot-password" class="forgot-link">¿Olvidó su contraseña?</a>
      <div class="divider"></div>
      <p>¿No tiene una cuenta? <span class="text-energy" routerLink="/auth/register">Registrarse gratis</span></p>
    </footer>
  </div>
</main>
