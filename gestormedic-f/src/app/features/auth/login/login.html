<main class="login-container">
  <div class="login-bento-card glass-morphism">
    <header class="login-header">
      <img
        ngSrc="logos/logo.png"
        alt="GestorMedic Logo"
        width="64"
        height="64"
        routerLink="/"
        priority
      />
      <h1 class="yale-title">Bienvenido a GestorMedic</h1>
      <p class="slate-subtitle">
        Ingrese sus credenciales para acceder a la plataforma de gestión médica.
      </p>
    </header>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
      <div class="field-group">
        <label for="email">Correo Institucional</label>
        <input
          id="email"
          type="email"
          pInputText
          formControlName="email"
          placeholder="ejemplo@gestormedic.com"
          class="gm-input"
          fluid
        />
      </div>

      <div class="field-group">
        <label for="password">Contraseña</label>
        <p-password
          id="password"
          formControlName="password"
          [toggleMask]="true"
          [feedback]="false"
          placeholder="••••••••"
          inputStyleClass="gm-input w-full"
          fluid
        />
      </div>

      <div class="form-actions">
        <button
          type="submit"
          class="gm-input w-full"
          style="background: var(--p-primary-500); color: white; padding: 0.75rem; border: none; border-radius: 2rem; cursor: pointer; font-weight: 600;"
          [disabled]="authStore.isLoading()"
        >
          {{ authStore.isLoading() ? 'Cargando...' : 'Acceder al Sistema' }}
        </button>
      </div>
    </form>

    <div style="display: flex; align-items: center; margin: 1.5rem 0; color: var(--p-slate-400)">
      <div style="flex-grow: 1; height: 1px; background-color: var(--p-surface-200)"></div>
      <span style="padding: 0 1rem; font-size: 0.8rem; font-weight: 600; text-transform: uppercase"
        >O continuar con</span
      >
      <div style="flex-grow: 1; height: 1px; background-color: var(--p-surface-200)"></div>
    </div>

    <div style="margin-bottom: 1.5rem">
      <gm-rounded-button
        label="Acceder con Google"
        icon="bx bxl-google"
        type="button"
        variant="outlined"
        severity="secondary"
        [disabled]="authStore.isLoading()"
        (onClick)="onGoogleLoginTrigger()"
        class="w-full"
        style="width: 100%; display: block"
      />
    </div>

    <footer class="login-footer">
      <a routerLink="/auth/forgot-password" class="forgot-link">¿Olvidó su contraseña?</a>
      <div class="divider"></div>
      <p>
        ¿No tiene una cuenta?
        <span class="text-energy" routerLink="/auth/register" style="cursor: pointer"
          >Registrarse gratis</span
        >
      </p>
    </footer>
  </div>
</main>
