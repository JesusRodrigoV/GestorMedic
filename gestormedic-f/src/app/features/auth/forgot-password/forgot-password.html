<main class="login-container">
  <div class="login-bento-card glass-morphism">
    <header class="login-header">
      <img ngSrc="logos/logo.png" alt="GestorMedic Logo" width="64" height="64" priority />
      <h1 class="yale-title">Recuperar Contraseña</h1>
      <p class="slate-subtitle">
        Ingrese su correo electrónico para recibir las instrucciones de recuperación.
      </p>
    </header>

    <form [formGroup]="forgotForm" (ngSubmit)="onRecover()" class="login-form">
      <div class="field-group">
        <label for="email">Correo Institucional</label>
        <input
          id="email"
          type="email"
          pInputText
          formControlName="email"
          placeholder="ejemplo@gestormedic.com"
          class="gm-input"
          fluid
        />
      </div>

      <div class="form-actions">
        <gm-rounded-button
          label="Enviar Instrucciones"
          type="submit"
          severity="primary"
          (onClick)="onRecover()"
        />
      </div>
    </form>

    <footer class="login-footer">
      <a routerLink="/auth/login" class="forgot-link">Volver al inicio de sesión</a>
    </footer>
  </div>
</main>
